<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <script>
        function togglePassword() {
            let p = document.getElementById("pass");
            p.type = p.type === "password" ? "text" : "password";
        }
    </script>
</head>
<body>

<div class="container-center">
    <div class="card p-4" style="width: 350px;">
        <h4 class="text-center">Reset Password</h4>

        <input type="password" id="pass" class="form-control mb-3" placeholder="New Password">

        <button onclick="togglePassword()" class="btn btn-outline-secondary w-100 mb-2">
            Show/Hide Password
        </button>

        <a href="login.html" class="btn btn-custom w-100">Update Password</a>
    </div>
</div>

</body>
</html>
